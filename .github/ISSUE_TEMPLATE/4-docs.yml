name: Documentation problem
description: Something on pleno.mohirlab.uz, in a README or in an error message is wrong, unclear or missing.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The link to the page, or the file name.
      placeholder: https://pleno.mohirlab.uz/guide/getting-started
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - An example does not run or gives a different result
        - Says something the language or tools do not do
        - Unclear or hard to follow
        - Missing
        - Broken link
        - Typo or wording
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Quote the text that is wrong and say what it should say, if you know.
    validations:
      required: true
