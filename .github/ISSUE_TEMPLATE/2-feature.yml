name: Feature request
description: Suggest a new standard library function, a tool feature or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For a change to the language itself (syntax, semantics, keywords), use the **Language proposal** form instead.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and why it is hard today. A real use case helps more than a feature name.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it would look to use. Show Pleno code where you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to do it, including how you work around it now, and how other languages handle it.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
