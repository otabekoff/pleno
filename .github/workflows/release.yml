name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build for ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: i686-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.job.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.job.target }}" == "i686-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-multilib
          fi

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.job.target }}

      - name: Code Signing (Windows)
        if: runner.os == 'Windows' && secrets.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $certPath = Join-Path $env:TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe" sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD /t http://timestamp.digicert.com /v target/${{ matrix.job.target }}/release/pleno.exe
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe" sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD /t http://timestamp.digicert.com /v target/${{ matrix.job.target }}/release/plm.exe
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Code Signing (macOS)
        if: runner.os == 'macOS' && secrets.MACOS_CERTIFICATE != ''
        run: |
          echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12
          security create-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" build.keychain
          /usr/bin/codesign --force --s "Developer ID Application: ${{ secrets.MACOS_DEVELOPER_ID }}" target/${{ matrix.job.target }}/release/pleno
          /usr/bin/codesign --force --s "Developer ID Application: ${{ secrets.MACOS_DEVELOPER_ID }}" target/${{ matrix.job.target }}/release/plm
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}

      - name: Packaging
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ runner.os }}" == "Windows" ]; then
            EXT=".exe"
          fi

          # Copy binaries
          cp target/${{ matrix.job.target }}/release/pleno$EXT dist/pleno$EXT
          cp target/${{ matrix.job.target }}/release/plm$EXT dist/plm$EXT

          # Generate .deb for Linux x64
          if [ "${{ runner.os }}" == "Linux" ] && [ "${{ matrix.job.target }}" == "x86_64-unknown-linux-gnu" ]; then
             cargo install cargo-deb
             cargo deb --target ${{ matrix.job.target }} --output dist/pleno_${{ github.ref_name }}_amd64.deb
          fi

          # Archive
          PACKAGE_NAME="pleno-${{ github.ref_name }}-${{ matrix.job.target }}"
          cd dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a -tzip ../$PACKAGE_NAME.zip *
          else
            tar -czf ../$PACKAGE_NAME.tar.gz .
          fi
          cd ..

          # Generate SHA256 hashes
          if [ "${{ runner.os }}" == "Windows" ]; then
             sha256sum "$PACKAGE_NAME.zip" > "$PACKAGE_NAME.zip.sha256"
          else
             sha256sum "$PACKAGE_NAME.tar.gz" > "$PACKAGE_NAME.tar.gz.sha256"
             if [ -f "dist/pleno_${{ github.ref_name }}_amd64.deb" ]; then
               sha256sum "dist/pleno_${{ github.ref_name }}_amd64.deb" > "pleno_${{ github.ref_name }}_amd64.deb.sha256"
             fi
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.job.target }}
          path: |
            pleno-${{ github.ref_name }}-${{ matrix.job.target }}.*
            dist/*.deb
            *.sha256

  # Build VS Code Extension
  vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ide/vscode
        run: npm ci

      - name: Build extension
        working-directory: ide/vscode
        run: npm run package

      - name: Package VSIX
        working-directory: ide/vscode
        run: npx @vscode/vsce package --out pleno-language-${{ github.ref_name }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-vscode
          path: ide/vscode/pleno-language-${{ github.ref_name }}.vsix

  # Finalize and Push to Release
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, vscode-extension]
  # Finalize and Push to Release
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, vscode-extension]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R all-artifacts

      - name: Generate Consolidated Checksums
        run: |
          cd all-artifacts
          find . -maxdepth 1 -type f -not -name "*.sha256" -not -name "SHA256SUMS.txt" | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: GPG Signing
        if: secrets.GPG_PRIVATE_KEY != ''
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Sign Checksums
        if: secrets.GPG_PRIVATE_KEY != ''
        run: |
          cd all-artifacts
          gpg --clearsign SHA256SUMS.txt
          cd ..

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: all-artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and push Docker images
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.DOCKERHUB_USERNAME != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            pleno/pleno:latest
            pleno/pleno:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Update Homebrew tap
  homebrew:
    name: Update Homebrew
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && secrets.HOMEBREW_TAP_TOKEN != ''
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew Formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: pleno
          homebrew-tap: otabekoff/homebrew-tap
          download-url: https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
