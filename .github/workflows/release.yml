name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # This job safely checks for secrets and provides outputs to other jobs.
  # Job-level 'if' conditions cannot access the 'secrets' context directly.
  check-secrets:
    name: Check for Secrets
    runs-on: ubuntu-latest
    outputs:
      has-dockerhub: ${{ steps.check.outputs.has-dockerhub }}
      has-homebrew: ${{ steps.check.outputs.has-homebrew }}
      has-scoop: ${{ steps.check.outputs.has-scoop }}
      has-winget: ${{ steps.check.outputs.has-winget }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "has-dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "has-homebrew=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-homebrew=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.SCOOP_BUCKET_TOKEN }}" ]; then
            echo "has-scoop=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-scoop=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.WINGET_TOKEN }}" ]; then
            echo "has-winget=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-winget=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build for ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: i686-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          targets: ${{ matrix.job.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "release-build"

      # Linux binaries link against glibc 2.17 through Zig, so they run on any
      # distribution from 2014 on (CentOS 7, Ubuntu 14.04, Debian 8). A plain
      # `cargo build` on ubuntu-latest would need the runner's glibc (2.39).
      - name: Install Zig (Linux)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-zigbuild@0.24.0

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            cargo zigbuild --release --workspace --target ${{ matrix.job.target }}.2.17
          else
            cargo build --release --workspace --target ${{ matrix.job.target }}
          fi

      - name: Check the glibc requirement (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          status=0
          for tool in pleno plm pleno-lsp pleno-repl pleno-dap; do
            bin=target/${{ matrix.job.target }}/release/$tool
            newest=$(readelf -W --version-info "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "$tool needs glibc $newest"
            if [ "$( (echo "$newest"; echo 2.17) | sort -V | tail -1)" != "2.17" ]; then
              echo "::error::$tool needs glibc $newest, newer than 2.17"
              status=1
            fi
          done
          if [ "${{ matrix.job.target }}" == "x86_64-unknown-linux-gnu" ]; then
            echo 'print("ok")' > smoke.pln
            # Run it on CentOS 7, whose glibc is 2.17.
            bin=./target/x86_64-unknown-linux-gnu/release/pleno
            docker run --rm -v "$PWD:/w" -w /w centos:7 sh -c "$bin --version && $bin smoke.pln" || status=1
          fi
          exit $status

      - name: Packaging
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ runner.os }}" == "Windows" ]; then
            EXT=".exe"
          fi

          # Copy binaries
          cp target/${{ matrix.job.target }}/release/pleno$EXT dist/pleno$EXT
          cp target/${{ matrix.job.target }}/release/plm$EXT dist/plm$EXT
          cp target/${{ matrix.job.target }}/release/pleno-lsp$EXT dist/pleno-lsp$EXT
          cp target/${{ matrix.job.target }}/release/pleno-repl$EXT dist/pleno-repl$EXT
          cp target/${{ matrix.job.target }}/release/pleno-dap$EXT dist/pleno-dap$EXT

          # Generate .deb for Linux x64
          if [ "${{ runner.os }}" == "Linux" ] && [ "${{ matrix.job.target }}" == "x86_64-unknown-linux-gnu" ]; then
             cargo install cargo-deb --locked --version 3.8.0
             cargo deb --no-build -p pleno-cli --target ${{ matrix.job.target }} --output pleno_${{ github.ref_name }}_amd64.deb
          fi

          # Archive
          PACKAGE_NAME="pleno-${{ github.ref_name }}-${{ matrix.job.target }}"
          cd dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a -tzip ../$PACKAGE_NAME.zip *
          else
            tar -czf ../$PACKAGE_NAME.tar.gz .
          fi
          cd ..

          # Generate SHA256 hashes
          if [ "${{ runner.os }}" == "Windows" ]; then
             sha256sum "$PACKAGE_NAME.zip" > "$PACKAGE_NAME.zip.sha256"
          else
             sha256sum "$PACKAGE_NAME.tar.gz" > "$PACKAGE_NAME.tar.gz.sha256"
             if [ -f "pleno_${{ github.ref_name }}_amd64.deb" ]; then
               sha256sum "pleno_${{ github.ref_name }}_amd64.deb" > "pleno_${{ github.ref_name }}_amd64.deb.sha256"
             fi
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ matrix.job.target }}
          path: |
            pleno-${{ github.ref_name }}-${{ matrix.job.target }}.*
            pleno_*.deb
            dist/*
            *.sha256

  vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # ESLint 10 and @vscode/test-electron 3 need Node 22, as in CI.
          node-version: "22"

      - name: Install dependencies
        working-directory: ide/vscode
        run: npm ci

      - name: Build extension
        working-directory: ide/vscode
        run: npm run package

      - name: Package VSIX
        working-directory: ide/vscode
        run: npx --yes @vscode/vsce@3.2.1 package --out pleno-language-${{ github.ref_name }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-vscode
          path: ide/vscode/pleno-language-${{ github.ref_name }}.vsix

  publish-github:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, vscode-extension]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Release Assets
        run: |
          cd all-artifacts
          # Sign all archive files and the generated checksums
          find . -maxdepth 1 -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.vsix" \) -exec cosign sign-blob --yes --bundle {}.bundle {} \;
          
          # Generate Consolidated Checksums (after signing to potentially include signatures? No, signatures are separate)
          find . -maxdepth 1 -type f -not -name "*.sha256" -not -name "SHA256SUMS.txt" -not -name "*.bundle" | xargs sha256sum > SHA256SUMS.txt
          
          # Sign the checksums file itself
          cosign sign-blob --yes --bundle SHA256SUMS.txt.bundle SHA256SUMS.txt
          
          cat SHA256SUMS.txt
          cd ..

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: all-artifacts/*
          generate_release_notes: true
          body: |
            Pleno is an open-source (MIT) programming language: a compiler and bytecode VM with a package manager (`plm`), language server, REPL and debug adapter. Each archive contains `pleno`, `plm`, `pleno-lsp`, `pleno-repl` and `pleno-dap` for one platform.

            Downloads are verified by checksums and Sigstore signatures. See the [Code signing policy](https://pleno.mohirlab.uz/code-signing-policy).
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build, check-secrets]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.check-secrets.outputs.has-dockerhub == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux amd64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-x86_64-unknown-linux-gnu
          path: bin-amd64

      - name: Download Linux arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-aarch64-unknown-linux-gnu
          path: bin-arm64

      - name: Prepare Binaries
        run: |
          # Every tool the archives ship; find locates them wherever the
          # artifact put them, and a missing one fails the job.
          for arch in amd64 arm64; do
            mkdir -p "binaries/$arch"
            for tool in pleno plm pleno-lsp pleno-dap pleno-repl; do
              found=$(find "bin-$arch" -name "$tool" -type f | head -n 1)
              if [ -z "$found" ]; then
                echo "::error::$tool not found in the $arch artifact"
                exit 1
              fi
              cp "$found" "binaries/$arch/$tool"
            done
          done
          chmod +x binaries/*/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pleno:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pleno:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The formula installs the prebuilt archives, with checksums from SHA256SUMS.txt.
  publish-homebrew:
    name: Update Homebrew
    runs-on: ubuntu-latest
    needs: [publish-github, check-secrets]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && needs.check-secrets.outputs.has-homebrew == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir release
          bash scripts/homebrew-formula.sh "${TAG#v}" release/SHA256SUMS.txt > pleno.rb
          cat pleno.rb

      - name: Push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/otabekoff/homebrew-tap.git" tap
          cp pleno.rb tap/Formula/pleno.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pleno.rb
          git diff --cached --quiet && exit 0
          git commit -m "pleno ${TAG#v}"
          git push

  # The manifest installs the Windows archive, with its checksum from SHA256SUMS.txt
  # (see packaging/README.md for the token).
  publish-scoop:
    name: Update Scoop
    runs-on: ubuntu-latest
    needs: [publish-github, check-secrets]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && needs.check-secrets.outputs.has-scoop == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir release
          bash scripts/scoop-manifest.sh "${TAG#v}" release/SHA256SUMS.txt > pleno.json
          cat pleno.json

      - name: Push it to the bucket
        env:
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone --depth 1 "https://x-access-token:${BUCKET_TOKEN}@github.com/otabekoff/scoop-bucket.git" bucket
          cp pleno.json bucket/bucket/pleno.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/pleno.json
          git diff --cached --quiet && exit 0
          git commit -m "pleno ${TAG#v}"
          git push

  # wingetcreate opens the pull request to microsoft/winget-pkgs from the token owner's fork.
  # It can only update a package winget already has, so until the first version is merged
  # this job skips with a notice (see packaging/README.md).
  publish-winget:
    name: Update WinGet
    runs-on: windows-latest
    needs: [publish-github, check-secrets]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && needs.check-secrets.outputs.has-winget == 'true'
    steps:
      - name: Check that winget has Pleno
        id: listed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/microsoft/winget-pkgs/contents/manifests/p/Pleno/Pleno --silent; then
            echo "listed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pleno.Pleno is not in microsoft/winget-pkgs yet; submit the first version by hand (packaging/README.md)."
            echo "listed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit the new version
        if: steps.listed.outputs.listed == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $version = $env:TAG.Substring(1)
          $url = "https://github.com/otabekoff/pleno/releases/download/$env:TAG/pleno-$env:TAG-x86_64-pc-windows-msvc.zip"
          .\wingetcreate.exe update Pleno.Pleno --version $version --urls $url `
            --release-notes-url "https://github.com/otabekoff/pleno/releases/tag/$env:TAG" `
            --submit --token $env:WINGET_TOKEN

  # The extension is published by its own workflow, publish-extension.yml, so the stores can
  # trust that one file (Open VSX's trusted publishing) and an old tag can be published by hand.
  # Events made with the GITHUB_TOKEN start no other workflow, except workflow_dispatch runs.
  publish-extension:
    name: Start publishing the VS Code extension
    runs-on: ubuntu-latest
    needs: [publish-github]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    permissions:
      actions: write
    steps:
      - name: Run publish-extension.yml for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run publish-extension.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
