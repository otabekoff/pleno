name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # This job safely checks for secrets and provides outputs to other jobs.
  # Job-level 'if' conditions cannot access the 'secrets' context directly.
  check-secrets:
    name: Check for Secrets
    runs-on: ubuntu-latest
    outputs:
      has-dockerhub: ${{ steps.check.outputs.has-dockerhub }}
      has-homebrew: ${{ steps.check.outputs.has-homebrew }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "has-dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "has-homebrew=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-homebrew=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build for ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: i686-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-build"

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.job.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.job.target }}" == "i686-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-multilib
          fi

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.job.target }}

      - name: Packaging
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ runner.os }}" == "Windows" ]; then
            EXT=".exe"
          fi

          # Copy binaries
          cp target/${{ matrix.job.target }}/release/pleno$EXT dist/pleno$EXT
          cp target/${{ matrix.job.target }}/release/plm$EXT dist/plm$EXT
          cp target/${{ matrix.job.target }}/release/pleno-lsp$EXT dist/pleno-lsp$EXT
          cp target/${{ matrix.job.target }}/release/pleno-repl$EXT dist/pleno-repl$EXT

          # Generate .deb for Linux x64
          if [ "${{ runner.os }}" == "Linux" ] && [ "${{ matrix.job.target }}" == "x86_64-unknown-linux-gnu" ]; then
             cargo install cargo-deb
             cargo deb --target ${{ matrix.job.target }} --output dist/pleno_${{ github.ref_name }}_amd64.deb
          fi

          # Archive
          PACKAGE_NAME="pleno-${{ github.ref_name }}-${{ matrix.job.target }}"
          cd dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a -tzip ../$PACKAGE_NAME.zip *
          else
            tar -czf ../$PACKAGE_NAME.tar.gz .
          fi
          cd ..

          # Generate SHA256 hashes
          if [ "${{ runner.os }}" == "Windows" ]; then
             sha256sum "$PACKAGE_NAME.zip" > "$PACKAGE_NAME.zip.sha256"
          else
             sha256sum "$PACKAGE_NAME.tar.gz" > "$PACKAGE_NAME.tar.gz.sha256"
             if [ -f "dist/pleno_${{ github.ref_name }}_amd64.deb" ]; then
               sha256sum "dist/pleno_${{ github.ref_name }}_amd64.deb" > "pleno_${{ github.ref_name }}_amd64.deb.sha256"
             fi
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.job.target }}
          path: |
            pleno-${{ github.ref_name }}-${{ matrix.job.target }}.*
            dist/*
            *.sha256

  vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ide/vscode
        run: npm ci

      - name: Build extension
        working-directory: ide/vscode
        run: npm run package

      - name: Package VSIX
        working-directory: ide/vscode
        run: npx @vscode/vsce package --out pleno-language-${{ github.ref_name }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-vscode
          path: ide/vscode/pleno-language-${{ github.ref_name }}.vsix

  publish-github:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, vscode-extension]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Generate Consolidated Checksums
        run: |
          cd all-artifacts
          find . -maxdepth 1 -type f -not -name "*.sha256" -not -name "SHA256SUMS.txt" | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: all-artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build, check-secrets]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.check-secrets.outputs.has-dockerhub == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux amd64
        uses: actions/download-artifact@v4
        with:
          name: artifacts-x86_64-unknown-linux-gnu
          path: bin-amd64

      - name: Download Linux arm64
        uses: actions/download-artifact@v4
        with:
          name: artifacts-aarch64-unknown-linux-gnu
          path: bin-arm64

      - name: Prepare Binaries
        run: |
          ls -R
          mkdir -p binaries/amd64 binaries/arm64
          
          # Use find to locate binaries regardless of directory structure
          cp $(find bin-amd64 -name "pleno" -type f | head -n 1) binaries/amd64/pleno
          cp $(find bin-amd64 -name "plm" -type f | head -n 1) binaries/amd64/plm
          cp $(find bin-amd64 -name "pleno-lsp" -type f | head -n 1) binaries/amd64/pleno-lsp
          cp $(find bin-amd64 -name "pleno-repl" -type f | head -n 1) binaries/amd64/pleno-repl
          
          cp $(find bin-arm64 -name "pleno" -type f | head -n 1) binaries/arm64/pleno
          cp $(find bin-arm64 -name "plm" -type f | head -n 1) binaries/arm64/plm
          cp $(find bin-arm64 -name "pleno-lsp" -type f | head -n 1) binaries/arm64/pleno-lsp
          cp $(find bin-arm64 -name "pleno-repl" -type f | head -n 1) binaries/arm64/pleno-repl
          
          chmod +x binaries/*/pleno binaries/*/plm binaries/*/pleno-lsp binaries/*/pleno-repl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pleno:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pleno:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-homebrew:
    name: Update Homebrew
    runs-on: ubuntu-latest
    needs: [build, check-secrets]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && needs.check-secrets.outputs.has-homebrew == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew Formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: pleno
          homebrew-tap: otabekoff/homebrew-tap
          download-url: https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
