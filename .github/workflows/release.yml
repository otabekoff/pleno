name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.job.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.job.target }}/release/pleno dist/
          cp target/${{ matrix.job.target }}/release/plm dist/
          cd dist
          tar -czf ../pleno-${{ github.ref_name }}-${{ matrix.job.target }}.tar.gz .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target/${{ matrix.job.target }}/release/pleno.exe dist/
          copy target/${{ matrix.job.target }}/release/plm.exe dist/
          cd dist
          Compress-Archive -Path * -DestinationPath ../pleno-${{ github.ref_name }}-${{ matrix.job.target }}.zip

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            pleno-${{ github.ref_name }}-${{ matrix.job.target }}.tar.gz
            pleno-${{ github.ref_name }}-${{ matrix.job.target }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
