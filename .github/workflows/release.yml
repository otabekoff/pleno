name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: i686-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.job.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.job.target }}" == "i686-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-multilib
          fi

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.job.target }}

      - name: Packaging
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ runner.os }}" == "Windows" ]; then
            EXT=".exe"
          fi

          # Copy binaries
          cp target/${{ matrix.job.target }}/release/pleno$EXT dist/pleno$EXT
          cp target/${{ matrix.job.target }}/release/plm$EXT dist/plm$EXT

          # Generate .deb for Linux x64
          if [ "${{ runner.os }}" == "Linux" ] && [ "${{ matrix.job.target }}" == "x86_64-unknown-linux-gnu" ]; then
             cargo install cargo-deb
             cargo deb --target ${{ matrix.job.target }} --output dist/pleno_${{ github.ref_name }}_amd64.deb
          fi

          # Archive
          cd dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a -tzip ../pleno-${{ github.ref_name }}-${{ matrix.job.target }}.zip *
          else
            tar -czf ../pleno-${{ github.ref_name }}-${{ matrix.job.target }}.tar.gz .
          fi

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            pleno-${{ github.ref_name }}-${{ matrix.job.target }}.*
            dist/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and push Docker images
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            pleno/pleno:latest
            pleno/pleno:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Update Homebrew tap
  homebrew:
    name: Update Homebrew
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew Formula
        uses: mislav/bump-homebrew-formula-action@v3
        if: ${{ !contains(github.ref_name, '-') }} # Skip pre-releases
        with:
          formula-name: pleno
          homebrew-tap: otabekoff/homebrew-tap
          download-url: https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
