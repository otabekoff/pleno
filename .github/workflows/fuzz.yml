name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to fuzz each target, in seconds (at most 21000, under the 6-hour job limit)"
        default: "120"
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/pleno-lexer/**"
      - "crates/pleno-parser/**"
      - "crates/pleno-compiler/**"
      - "crates/pleno-optimizer/**"
      - "crates/pleno-vm/**"
      - "crates/pleno-value/**"
      - "crates/pleno-stdlib/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # fuzz_run runs each program with the fast and the general interpreter
        # loop and fails when they disagree.
        target: [fuzz_lexer, fuzz_parser, fuzz_compile, fuzz_run]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The repository's programs are the seed corpus, so mutations start from
      # real code instead of random bytes.
      - name: Collect seed programs
        run: |
          mkdir -p fuzz/seeds
          find tests examples dev-tests -name '*.pln' | while read -r file; do
            cp "$file" "fuzz/seeds/$(echo "$file" | tr '/' '_')"
          done

      # Short runs (pull requests, the weekly run) use AddressSanitizer. Long
      # runs of the safe-Rust targets use none: its quarantine and bookkeeping
      # grow with every input and ran out of memory after 74 minutes on
      # 2026-10-24 with only 35 MB of live heap, and a panic still fails the
      # run. fuzz_run keeps AddressSanitizer, because the VM has unsafe code,
      # with a smaller quarantine, and looks for memory errors, leaks (a
      # dropped VM frees its reference cycles since #147) and disagreements
      # between the interpreter loops.
      - name: Fuzz
        env:
          SECONDS_TO_RUN: ${{ inputs.seconds || '120' }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          flags="-max_total_time=$SECONDS_TO_RUN -timeout=30 -rss_limit_mb=4096"
          if [ "$SECONDS_TO_RUN" -gt 600 ] && [ "$TARGET" != fuzz_run ]; then
            cargo fuzz run --sanitizer none "$TARGET" "fuzz/corpus/$TARGET" fuzz/seeds -- $flags
          else
            export ASAN_OPTIONS="quarantine_size_mb=64:malloc_context_size=4:detect_leaks=1"
            cargo fuzz run "$TARGET" "fuzz/corpus/$TARGET" fuzz/seeds -- $flags
          fi

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
