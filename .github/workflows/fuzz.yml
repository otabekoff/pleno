name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to fuzz each target, in seconds (at most 21000, under the 6-hour job limit)"
        default: "120"
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/pleno-lexer/**"
      - "crates/pleno-parser/**"
      - "crates/pleno-compiler/**"
      - ".github/workflows/fuzz.yml"

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_lexer, fuzz_parser, fuzz_compile]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Short runs (pull requests, the weekly run) use AddressSanitizer. Long
      # runs use none: its quarantine and bookkeeping grow with every input
      # and ran out of memory after 74 minutes on 2026-10-24 with only 35 MB
      # of live heap. The fuzzed crates are safe Rust, so a panic still
      # fails the run.
      - name: Fuzz
        env:
          SECONDS_TO_RUN: ${{ inputs.seconds || '120' }}
        run: |
          if [ "$SECONDS_TO_RUN" -gt 600 ]; then
            cargo fuzz run --sanitizer none ${{ matrix.target }} -- -max_total_time="$SECONDS_TO_RUN" -rss_limit_mb=4096
          else
            cargo fuzz run ${{ matrix.target }} -- -max_total_time="$SECONDS_TO_RUN"
          fi

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
