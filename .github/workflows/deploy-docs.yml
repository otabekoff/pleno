# Builds the docs (with the playground's WebAssembly) on every pull request and push, and from
# `main` deploys them to GitHub Pages, served at pleno.mohirlab.uz (the custom domain is set in the
# repository's Pages settings; DNS: CNAME pleno -> otabekoff.github.io).
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; superseded PR runs are cancelled, production runs are not
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'docs-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for "last updated" timestamps

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The playground and tutorial run Pleno compiled to WebAssembly.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install wasm-bindgen
        # Must match the wasm-bindgen version in Cargo.lock.
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasm-bindgen-cli@0.2.108

      - name: Build the playground
        run: bun run docs:wasm

      - name: Build with VitePress
        run: bun run docs:build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://pleno.mohirlab.uz
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
