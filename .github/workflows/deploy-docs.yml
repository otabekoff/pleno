# Builds the docs (with the playground's WebAssembly) on every pull request and push, and from
# `main` deploys them to GitHub Pages, served at pleno.mohirlab.uz (the custom domain is set in the
# repository's Pages settings; DNS: CNAME pleno -> otabekoff.github.io).
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; superseded PR runs are cancelled, production runs are not
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'docs-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for "last updated" timestamps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The playground and tutorial run Pleno compiled to WebAssembly.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen
        # Must match the wasm-bindgen version in Cargo.lock.
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.108

      - name: Build the playground
        run: bun run docs:wasm

      - name: Build with VitePress
        run: bun run docs:build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://pleno.mohirlab.uz
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
