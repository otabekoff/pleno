# Builds the docs (with the playground's WebAssembly) on every pull request and push; from `main`
# it deploys to Netlify (pleno.mohirlab.uz) and points the old GitHub Pages URL at the new domain.
#
# Repository secrets: NETLIFY_AUTH_TOKEN (personal access token), NETLIFY_SITE_ID
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; superseded PR runs are cancelled, production runs are not
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'docs-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for "last updated" timestamps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The playground and tutorial run Pleno compiled to WebAssembly.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen
        # Must match the wasm-bindgen version in Cargo.lock.
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.108

      - name: Build the playground
        run: bun run docs:wasm

      - name: Build with VitePress
        run: bun run docs:build

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/.vitepress/dist
          retention-days: 7

      # Served for the root and, as 404.html, for every old deep link
      - name: Prepare GitHub Pages redirect
        if: github.event_name != 'pull_request'
        run: cp .github/pages-redirect/index.html .github/pages-redirect/404.html

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect

  deploy-netlify:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pleno.mohirlab.uz
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # The commit message goes through env, never straight into the script, so it can't inject shell
      - name: Deploy to Netlify
        run: |
          npx --yes netlify-cli@27 deploy --prod --no-build --dir dist --message "${GITHUB_SHA::7}: ${COMMIT_MESSAGE%%$'\n'*}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual deploy' }}

  # The old URL (otabekoff.github.io/pleno/) forwards every path to pleno.mohirlab.uz
  deploy-pages-redirect:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
