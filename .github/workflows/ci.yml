name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      # The fuzz crate has its own lockfile; a version bump must update it too.
      - name: Check that the lockfiles are up to date
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Runs the unit, integration and doc tests of every crate.
      - name: Run tests
        run: cargo test --workspace
      - name: Build pleno
        run: cargo build --bin pleno
      - name: Run .pln test scripts and examples
        run: bash scripts/run_pln_tests.sh
      - name: HTTP server smoke test
        run: bash scripts/test_http_server.sh
      - name: Package manifest update test
        run: bash scripts/test_update_packaging.sh
      - name: Run the examples in the docs
        run: python3 scripts/check-doc-examples.py target/debug/pleno docs

  # Installs the published releases with the install scripts, as users do: the latest, an older
  # one, and an update while the language server runs. Needs network access to github.com.
  release-install:
    name: Release installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release-install.sh
        if: runner.os != 'Windows'
        run: bash scripts/test_release_install.sh
      - name: Test release-install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_release_install.ps1
      - name: Test release-install.ps1 in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_release_install.ps1

  wasm:
    name: WASM build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-bindgen
        # Must match the wasm-bindgen version in Cargo.lock.
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasm-bindgen-cli@0.2.108
      - name: Build the playground's WebAssembly
        run: bash scripts/build-playground.sh
      - name: Run programs through it
        run: node scripts/playground-smoke.mjs

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ide/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run compile:tsc
      - name: Lint
        run: npm run lint
      - name: Bundle
        run: npm run package
      - name: Run the extension tests in VS Code
        # Downloads VS Code; it needs a display, which xvfb provides.
        run: xvfb-run -a npm test

  benchmark:
    name: Benchmark Regression Check
    # Compares the change against its base branch on the same runner.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the change
        run: cargo build --release --bin pleno
      - name: Build the base branch
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          cargo build --release --bin pleno --manifest-path ../base/Cargo.toml --target-dir target/base
      - name: Compare benchmarks
        run: python3 bench/regression_test.py --base target/base/release/pleno --head target/release/pleno
