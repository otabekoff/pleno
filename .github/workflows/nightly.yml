name: Nightly Build

on:
  schedule:
    - cron: "0 0 * * *" # Run at midnight every day
  workflow_dispatch: # Allow manual triggering

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: i686-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          targets: ${{ matrix.job.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The same setup as release.yml, so a nightly that passes means a tagged
      # release builds too.
      # Linux binaries link against glibc 2.17 through Zig, so they run on any
      # distribution from 2014 on (CentOS 7, Ubuntu 14.04, Debian 8). A plain
      # `cargo build` on ubuntu-24.04 would need the runner's glibc (2.39).
      - name: Install Zig (Linux)
        if: runner.os == 'Linux'
        # The official build, checked against the SHA-256 that ziglang.org
        # publishes (download/index.json).
        shell: bash
        env:
          ZIG: zig-x86_64-linux-0.14.1
          ZIG_SHA256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$ZIG.tar.xz" "https://ziglang.org/download/0.14.1/$ZIG.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$ZIG.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$ZIG.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$ZIG" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-zigbuild@0.24.0

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            cargo zigbuild --release --workspace --target ${{ matrix.job.target }}.2.17
          else
            cargo build --release --workspace --target ${{ matrix.job.target }}
          fi

      - name: Check the glibc requirement (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          status=0
          for tool in pleno plm pleno-lsp pleno-repl pleno-dap; do
            bin=target/${{ matrix.job.target }}/release/$tool
            newest=$(readelf -W --version-info "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "$tool needs glibc $newest"
            if [ "$( (echo "$newest"; echo 2.17) | sort -V | tail -1)" != "2.17" ]; then
              echo "::error::$tool needs glibc $newest, newer than 2.17"
              status=1
            fi
          done
          if [ "${{ matrix.job.target }}" == "x86_64-unknown-linux-gnu" ]; then
            echo 'print("ok")' > smoke.pln
            # Run it on CentOS 7, whose glibc is 2.17.
            bin=./target/x86_64-unknown-linux-gnu/release/pleno
            docker run --rm -v "$PWD:/w" -w /w centos:7 sh -c "$bin --version && $bin smoke.pln" || status=1
          fi
          exit $status

      - name: Packaging
        shell: bash
        run: |
          mkdir -p dist
          DATE=$(date +%Y%m%d)
          EXT=""
          if [ "${{ runner.os }}" == "Windows" ]; then
            EXT=".exe"
          fi

          # Copy binaries (every tool a release ships)
          for tool in pleno plm pleno-lsp pleno-repl pleno-dap; do
            cp target/${{ matrix.job.target }}/release/$tool$EXT dist/$tool$EXT
          done

          # Archive
          PACKAGE_NAME="pleno-nightly-$DATE-${{ matrix.job.target }}"
          cd dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a -tzip ../$PACKAGE_NAME.zip *
          else
            tar -czf ../$PACKAGE_NAME.tar.gz .
          fi
          cd ..

      # Only the scheduled run on main publishes; a manual run (on any branch)
      # just checks that every release target builds.
      - name: Create Nightly Release
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nightly-${{ github.sha }}
          name: Nightly Build (${{ github.sha }})
          body: "Automated nightly build for commit ${{ github.sha }}."
          files: |
            pleno-nightly-*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
