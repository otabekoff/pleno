<!doctype html>
<!-- The docs moved from otabekoff.github.io/pleno/ to pleno.mohirlab.uz. GitHub Pages serves this
     file for the root and (as 404.html) for every old path, forwarding to the same page on the new domain. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Pleno docs have moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://pleno.mohirlab.uz/">
  <meta http-equiv="refresh" content="0; url=https://pleno.mohirlab.uz/">
  <script>
    location.replace('https://pleno.mohirlab.uz' + location.pathname.replace(/^\/pleno/, '') + location.search + location.hash)
  </script>
</head>
<body>
  <p>The Pleno documentation now lives at <a href="https://pleno.mohirlab.uz/">pleno.mohirlab.uz</a>.</p>
</body>
</html>
