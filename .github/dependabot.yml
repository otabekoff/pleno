# Weekly dependency updates. Each ecosystem gets at most two pull requests a week:
# one for its minor and patch updates and one for its major updates, which more
# often need code changes. Security updates still arrive as soon as they exist.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /ide/vscode
    schedule:
      interval: weekly
    groups:
      vscode-extension:
        update-types: [minor, patch]
      vscode-extension-major:
        update-types: [major]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      docs-site:
        update-types: [minor, patch]
      docs-site-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
