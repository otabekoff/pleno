# Weekly dependency updates. Minor and patch updates are grouped into one pull
# request per ecosystem; security updates still arrive as soon as they exist.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ide/vscode
    schedule:
      interval: weekly
    groups:
      vscode-extension:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      docs-site:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
