# Weekly dependency updates. Each ecosystem gets at most two pull requests a week:
# one for its minor and patch updates and one for its major updates, which more
# often need code changes. Security updates still arrive as soon as they exist.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
    ignore:
      # bincode 3.0 is a placeholder release that fails to compile; the
      # project stopped there. Bytecode files keep the 1.x format.
      - dependency-name: bincode
        versions: [">=3"]

  - package-ecosystem: npm
    directory: /ide/vscode
    schedule:
      interval: weekly
    groups:
      vscode-extension:
        update-types: [minor, patch]
      vscode-extension-major:
        update-types: [major]
    ignore:
      # typescript-eslint 8 supports TypeScript below 6.1 only; raise this
      # when it supports newer versions.
      - dependency-name: typescript
        versions: [">=6.1"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      docs-site:
        update-types: [minor, patch]
      docs-site-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
