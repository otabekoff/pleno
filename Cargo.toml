[workspace]
resolver = "2"
members = ["crates/*", "fuzz"]
default-members = ["crates/pleno-cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
pleno-ast = { path = "crates/pleno-ast" }
pleno-lexer = { path = "crates/pleno-lexer" }
pleno-parser = { path = "crates/pleno-parser" }
pleno-formatter = { path = "crates/pleno-formatter" }
pleno-runtime = { path = "crates/pleno-runtime" }
pleno-lsp = { path = "crates/pleno-lsp" }
pleno-repl = { path = "crates/pleno-repl" }
pleno-common = { path = "crates/pleno-common" }
pleno-diagnostics = { path = "crates/pleno-diagnostics" }
pleno-value = { path = "crates/pleno-value" }
pleno-bytecode = { path = "crates/pleno-bytecode" }
pleno-compiler = { path = "crates/pleno-compiler" }
pleno-vm = { path = "crates/pleno-vm" }
pleno-package = { path = "crates/pleno-package" }
pleno-stdlib = { path = "crates/pleno-stdlib" }
pleno-linter = { path = "crates/pleno-linter" }
pleno-doc = { path = "crates/pleno-doc" }
thiserror = "1"
serde_json = "1"
rustyline = "14"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
rand = "0.8"
regex = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
proptest = "1"
base64 = "0.22"
url = "2"
csv = "1.3"
uuid = { version = "1", features = ["v4", "v7", "fast-rng"] }
quick-xml = { version = "0.36", features = ["serialize"] }
serde_yaml = "0.9"
toml = "0.8"
