[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/pleno-cli"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"
authors = ["Otabek"]
description = "A modern, high-performance programming language designed for clarity, safety, and expressiveness."
repository = "https://github.com/otabekoff/pleno"
homepage = "https://pleno.mohirlab.uz"

[workspace.dependencies]
pleno-ast = { path = "crates/pleno-ast" }
pleno-lexer = { path = "crates/pleno-lexer" }
pleno-parser = { path = "crates/pleno-parser" }
pleno-formatter = { path = "crates/pleno-formatter" }
pleno-runtime = { path = "crates/pleno-runtime" }
pleno-lsp = { path = "crates/pleno-lsp" }
pleno-repl = { path = "crates/pleno-repl" }
pleno-common = { path = "crates/pleno-common" }
pleno-diagnostics = { path = "crates/pleno-diagnostics" }
pleno-value = { path = "crates/pleno-value" }
pleno-bytecode = { path = "crates/pleno-bytecode" }
pleno-compiler = { path = "crates/pleno-compiler" }
pleno-vm = { path = "crates/pleno-vm" }
pleno-package = { path = "crates/pleno-package" }
pleno-stdlib = { path = "crates/pleno-stdlib" }
pleno-linter = { path = "crates/pleno-linter" }
pleno-dap = { path = "crates/pleno-dap" }
pleno-doc = { path = "crates/pleno-doc" }
pleno-optimizer = { path = "crates/pleno-optimizer" }
thiserror = "1"
serde_json = { version = "1", features = ["preserve_order"] }
rustyline = "19"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
rand = "0.8"
regex = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive", "rc"] }
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
proptest = "1"
base64 = "0.22"
url = "2"
csv = "1.3"
uuid = { version = "1", features = ["v4", "v7", "fast-rng"] }
quick-xml = { version = "0.42", features = ["serialize"] }
serde_yaml = "0.9"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
mio = { version = "1", features = ["net", "os-poll"] }
sha2 = "0.10"
hex = "0.4"

# Small WebAssembly builds for the docs playground: cargo build --profile wasm.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
