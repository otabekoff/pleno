[package]
name = "pleno-ast-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pleno-lexer = { path = "../crates/pleno-lexer" }
pleno-parser = { path = "../crates/pleno-parser" }
pleno-ast = { path = "../crates/pleno-ast" }

[[bin]]
name = "fuzz_lexer"
path = "fuzz_targets/fuzz_lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false
bench = false
