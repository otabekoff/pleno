[package]
name = "pleno-wasm"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = { workspace = true }
console_error_panic_hook = "0.1"
# rand 0.10 uses getrandom 0.4, which needs the wasm_js feature in the browser.
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.20", features = ["v4", "js"] }

# Workspace dependencies
pleno-lexer = { workspace = true }
pleno-parser = { workspace = true }
pleno-value = { workspace = true }
pleno-bytecode = { workspace = true }
pleno-compiler = { workspace = true }
pleno-vm = { path = "../pleno-vm", default-features = false }
pleno-stdlib = { path = "../pleno-stdlib", default-features = false }
pleno-diagnostics = { workspace = true }
