[package]
name = "pleno-wasm"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.20", features = ["v4", "js"] }

# Workspace dependencies
pleno-ast = { workspace = true }
pleno-lexer = { workspace = true }
pleno-parser = { workspace = true }
pleno-common = { workspace = true }
pleno-value = { workspace = true }
pleno-bytecode = { workspace = true }
pleno-compiler = { workspace = true }
pleno-vm = { workspace = true }
pleno-stdlib = { path = "../pleno-stdlib", default-features = false }
pleno-diagnostics = { workspace = true }
