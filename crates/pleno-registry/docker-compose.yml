# Docker Compose for Pleno Registry Production
services:
  registry:
    build:
      context: ../../
      dockerfile: crates/pleno-registry/Dockerfile
    ports:
      - "${PLENO_REGISTRY_PORT:-8080}:8080"
    volumes:
      - registry_data:/data
    environment:
      - PLENO_REGISTRY_DB=/data/registry.db
      - PLENO_REGISTRY_HOST=0.0.0.0
      - PLENO_REGISTRY_PORT=8080
      - PLENO_ADMIN_TOKEN=${PLENO_ADMIN_TOKEN}
    restart: always

volumes:
  registry_data:
