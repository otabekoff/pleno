[package]
name = "pleno-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pleno"
path = "src/main.rs"

[[bin]]
name = "plm"
path = "src/bin/plm.rs"

[package.metadata.deb]
maintainer = "Otabek <sadiridinovotabek@gmail.com>"
copyright = "2026, Otabek"
license-file = ["../../LICENSE", "0"]
extended-description = """
Pleno is a modern, high-performance programming language.
This package contains the 'pleno' runner, the 'plm' package manager, the
'pleno-lsp' language server, the 'pleno-dap' debug adapter and the
'pleno-repl' shell.
"""
section = "devel"
priority = "optional"
assets = [
    [
        "target/release/pleno",
        "usr/bin/pleno",
        "755",
    ],
    [
        "target/release/plm",
        "usr/bin/plm",
        "755",
    ],
    # Built by the workspace build that runs before cargo deb (release.yml).
    [
        "target/release/pleno-lsp",
        "usr/bin/pleno-lsp",
        "755",
    ],
    [
        "target/release/pleno-dap",
        "usr/bin/pleno-dap",
        "755",
    ],
    [
        "target/release/pleno-repl",
        "usr/bin/pleno-repl",
        "755",
    ],
]

[dependencies]
pleno-lexer = { workspace = true }
pleno-parser = { workspace = true }
pleno-compiler = { workspace = true }
pleno-vm = { workspace = true }
pleno-formatter = { workspace = true }
pleno-ast = { workspace = true }
pleno-common = { workspace = true }
pleno-package = { workspace = true }
pleno-diagnostics = { workspace = true }
pleno-stdlib = { workspace = true }
pleno-lsp = { workspace = true }
pleno-repl = { workspace = true }
pleno-linter = { workspace = true }
pleno-doc = { workspace = true }
pleno-dap = { workspace = true }
pleno-value = { workspace = true }
serde_json = { workspace = true }
notify = "8"
pleno-bytecode = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
winresource = "0.1"
