[package]
name = "pleno-package"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
semver = "1.0"
thiserror = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
bincode = "1"
pleno-ast = { workspace = true }
pleno-lexer = { workspace = true }
pleno-parser = { workspace = true }
pleno-compiler = { workspace = true }
pleno-bytecode = { workspace = true }
