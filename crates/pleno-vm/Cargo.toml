[package]
name = "pleno-vm"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
pleno-bytecode = { workspace = true }
pleno-value = { workspace = true }
pleno-lexer = { workspace = true }
pleno-parser = { workspace = true }
pleno-compiler = { workspace = true }
pleno-common = { workspace = true }
toml = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
mio = { workspace = true, optional = true }
hex = { workspace = true }

[features]
default = ["net"]
net = ["dep:mio", "pleno-value/net"]

[dev-dependencies]
pleno-stdlib = { workspace = true }
proptest = { workspace = true }
env_logger = { workspace = true }
num-traits = "0.2"
